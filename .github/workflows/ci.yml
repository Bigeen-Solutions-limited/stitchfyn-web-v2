name: CI

# LR-3: typecheck + production build + unit tests on every push to main and
# every PR. Lint is not gated yet: 154 pre-existing errors (launch-readiness
# doc §5 "Quality"); add `npm run lint` here once they are cleared.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # No lint errors, and no more warnings than today (155); lower the number as warnings are fixed, never raise it
      - name: Lint
        run: npm run lint -- --max-warnings=155
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
